repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]

      - id: pyright
        name: pyright type-check
        entry: .venv/bin/pyright --pythonpath .venv/bin/python
        language: system
        types: [python]

      - id: pytest
        name: pytest
        entry: .venv/bin/pytest tests/ -q -m "not deepeval"
        language: system
        types: [python]
        pass_filenames: false
