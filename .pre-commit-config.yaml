repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pyright
        name: pyright type-check
        entry: uv run pyright
        language: system
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest tests/ -q -m "not deepeval"
        language: system
        types: [python]
        pass_filenames: false
