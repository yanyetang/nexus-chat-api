name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app

      - name: Type check
        run: pyright --pythonpath "$(which python)" app

      - name: Dependency vulnerability scan
        run: >
          test -z "$(pip-audit -r requirements.txt --format=json 2>/dev/null
          | jq '.dependencies[].vulns[].fix_versions[]')"
          || pip-audit -r requirements.txt

      - name: Import smoke test
        run: python -c "from app.main import app; print('app-loaded')"
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          SUPPLIER_API_BASE_URL: https://placeholder.example.com
          COHERE_API_KEY: placeholder
          OPENROUTER_API_KEY: placeholder

      - name: Tests
        run: pytest tests/ -v
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          SUPPLIER_API_BASE_URL: https://placeholder.example.com
          COHERE_API_KEY: placeholder
          OPENROUTER_API_KEY: placeholder
