name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check app

      - name: Type check
        run: uv run pyright app

      - name: Dependency vulnerability scan
        run: >
          test -z "$(uv run pip-audit --format=json 2>/dev/null
          | jq '.dependencies[].vulns[].fix_versions[]')"
          || uv run pip-audit

      - name: Import smoke test
        run: uv run python -c "from app.main import app; print('app-loaded')"
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          SUPPLIER_API_BASE_URL: https://placeholder.example.com
          COHERE_API_KEY: placeholder

      - name: Tests
        run: uv run pytest tests/ -v -m "not deepeval"
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          SUPPLIER_API_BASE_URL: https://placeholder.example.com
          COHERE_API_KEY: placeholder
