name: rag-eval

on:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "app/services/retriever.py"
      - "app/services/rag.py"
      - "app/utils/prompts.py"
  workflow_dispatch:

jobs:
  deepeval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: DeepEval login
        if: ${{ secrets.DEEPEVAL_API_KEY != '' }}
        run: deepeval login --api-key "${{ secrets.DEEPEVAL_API_KEY }}"

      - name: Run RAG evaluation suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        if: ${{ secrets.DEEPEVAL_API_KEY != '' }}
        run: pytest tests/eval -m deepeval -q

      - name: PR summary
        if: ${{ github.event_name == 'pull_request' && secrets.DEEPEVAL_API_KEY != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'DeepEval workflow completed.',
              'See workflow logs for ContextualPrecision, ContextualRecall, Faithfulness, and AnswerRelevancy metrics.'
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
