name: rag-eval

on:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "app/services/retriever.py"
      - "app/services/rag.py"
      - "app/utils/prompts.py"
  workflow_dispatch:

jobs:
  deepeval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPEVAL_API_KEY: ${{ secrets.DEEPEVAL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: DeepEval login
        if: env.DEEPEVAL_API_KEY != ''
        run: deepeval login --api-key "$DEEPEVAL_API_KEY"

      - name: Report evaluation mode
        run: |
          if [ -n "$GROQ_API_KEY" ] || [ -n "$OPENROUTER_API_KEY" ]; then
            echo "DeepEval mode: live judge execution (judge API key present)."
          else
            echo "DeepEval mode: skip-only run (no judge API key set)."
          fi

      - name: Run RAG evaluation suite
        run: pytest tests/eval -m deepeval -q -rs

      - name: PR summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const liveMode = !!process.env.OPENROUTER_API_KEY;
            const body = [
              'DeepEval workflow completed.',
              liveMode
                ? 'Mode: live judge execution (OpenRouter key present).'
                : 'Mode: skip-only (OPENROUTER_API_KEY missing; tests intentionally skipped).',
              'See workflow logs for ContextualPrecision, ContextualRecall, Faithfulness, and AnswerRelevancy metric output.'
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
