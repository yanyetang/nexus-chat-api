name: rag-eval

on:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "app/services/retriever.py"
      - "app/services/rag.py"
      - "app/utils/prompts.py"
  workflow_dispatch:

jobs:
  deepeval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CONFIDENT_API_KEY: ${{ secrets.CONFIDENT_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Report evaluation mode
        run: |
          _placeholders="placeholder dummy test example your_api_key none null"
          _key_lc=$(echo "${OPENROUTER_API_KEY}" | tr '[:upper:]' '[:lower:]' | xargs)
          _is_placeholder=false
          for _p in $_placeholders; do
            [ "$_key_lc" = "$_p" ] && _is_placeholder=true && break
          done
          if [ -n "$OPENROUTER_API_KEY" ] && [ "$_is_placeholder" = "false" ]; then
            echo "DeepEval mode: live judge via OpenRouter (suite will skip if credentials are rejected)."
          else
            echo "DeepEval mode: skip-only run (OPENROUTER_API_KEY not set or is a placeholder)."
          fi

      - name: Login to Confident AI
        run: deepeval login --confident-api-key "$CONFIDENT_API_KEY"

      - name: Run RAG evaluation suite
        run: pytest tests/eval -m deepeval -v -rs

      - name: PR summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const placeholders = new Set(['placeholder','dummy','test','example','your_api_key','none','null']);
            const rawKey = (process.env.OPENROUTER_API_KEY || '').trim().toLowerCase();
            const liveMode = rawKey.length > 0 && !placeholders.has(rawKey);
            const body = [
              'DeepEval workflow completed.',
              liveMode
                ? 'Mode: live judge via OpenRouter (suite skips if credentials are rejected).'
                : 'Mode: skip-only (OPENROUTER_API_KEY not set or is a placeholder; tests intentionally skipped).',
              'See workflow logs for ContextualPrecision, ContextualRecall, Faithfulness, and AnswerRelevancy metric output.'
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
