name: rag-eval

on:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "app/services/retriever.py"
      - "app/services/rag.py"
      - "app/utils/prompts.py"
  workflow_dispatch:

jobs:
  deepeval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CONFIDENT_API_KEY: ${{ secrets.CONFIDENT_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Report evaluation mode
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "DeepEval mode: judge auth requested via OpenRouter (suite will skip if auth is rejected)."
          else
            echo "DeepEval mode: skip-only run (OPENROUTER_API_KEY not set)."
          fi

      - name: Run RAG evaluation suite
        run: pytest tests/eval -m deepeval -q -rs

      - name: PR summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const liveMode = !!process.env.OPENROUTER_API_KEY;
            const body = [
              'DeepEval workflow completed.',
              liveMode
                ? 'Mode: judge auth requested via OpenRouter (suite skips if auth is rejected).'
                : 'Mode: skip-only (OPENROUTER_API_KEY not set; tests intentionally skipped).',
              'See workflow logs for ContextualPrecision, ContextualRecall, Faithfulness, and AnswerRelevancy metric output.'
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
